<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme · Connected apps</title>
    <link rel="stylesheet" href="ds/tokens.css" />
    <link rel="stylesheet" href="ds/components.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page stack">
      <header>
        <h1 class="type-title">Connected apps</h1>
        <p class="type-body muted">
          Apps you've connected can access your workspace. Access lasts 90 days.
        </p>
      </header>

      <section class="card stack">
        <h2 class="type-heading">Workspace policy</h2>
        <label class="policy">
          <input type="checkbox" id="allow-changes" checked />
          Allow apps to make changes
        </label>
      </section>

      <section class="card">
        <div id="error"></div>
        <ul id="apps" class="apps"></ul>
      </section>

      <section class="card danger-zone">
        <h2 class="type-heading">Danger zone</h2>
        <button id="delete-workspace" class="big-red">Delete workspace</button>
      </section>
    </main>

    <dialog id="confirm">
      <p>Are you sure?</p>
      <div class="dialog-actions">
        <button id="confirm-ok" autofocus>OK</button>
        <button id="confirm-cancel">Cancel</button>
      </div>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
